{% load static %}
{% url 'home' as home_url %}
<header class="site-header">
    <div class="nav" data-ob>
        <a href="{{ home_url }}" class="nav-brand">
            <span class="nav-logo">CC</span>
            <span class="nav-brand-name">Candela Mimbí Cáceres</span>
        </a>

        <nav class="nav-links">
            <a href="{{ home_url }}#inicio"{% if request.resolver_match.url_name == 'home' %} class="is-active"{% endif %}>Inicio</a>
            <a href="{{ home_url }}#proyectos">Proyectos</a>
            <a href="{{ home_url }}#stack">Tecnologías</a>
            <a href="{{ home_url }}#sobre-mi">Sobre mí</a>
        </nav>

        <div class="nav-actions">
            <a href="{{ home_url }}#contacto" class="btn btn-primary btn-nav">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 6.5l8.5 7 8.5-7"></path></svg>
                Contáctame
            </a>
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar tema">☾</button>
        </div>
    </div>
</header>
